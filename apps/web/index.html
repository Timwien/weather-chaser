<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>WeatherChaser</title>
    <meta name="description" content="Find the best weather for your trip. WeatherChaser scores destinations by forecast and plans a route through the sunniest stops." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1416" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WeatherChaser" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WeatherChaser" />
    <meta property="og:title" content="WeatherChaser" />
    <meta property="og:description" content="Find the best weather for your trip and plan a route through the sunniest stops." />
    <meta property="og:url" content="https://weather-chaser.vercel.app" />
    <meta property="og:image" content="https://weather-chaser.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WeatherChaser" />
    <meta name="twitter:description" content="Find the best weather for your trip and plan a route through the sunniest stops." />
    <meta name="twitter:image" content="https://weather-chaser.vercel.app/og-image.png" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('wc-theme') || 'system';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
